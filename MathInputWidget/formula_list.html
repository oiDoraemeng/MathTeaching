<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mathlive-fonts.css">
  <style>
    /* 中文走系统黑体：优先装机的现代黑体，找不到再回退到雅黑，最后才用系统默认。
       size-adjust 只缩放这一个族，KaTeX 公式字形不受影响——否则同一字号下
       中文会占满 em 方框，看起来比公式字形大很多。 */
    @font-face {
      font-family: "MI CJK";
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    /* 关键修复：MathLive 把中日韩字符当成普通数学符号渲染（class=ML__cmr / ML__mathit），
       字体链在它自己的样式里写死为 KaTeX_Main / KaTeX_Math，--text-font-family 根本管不到。
       于是中文直接回退到系统默认字体，并占满整个 em 方框，看着比公式字形大一圈。
       下面给这两个数学字体族各补一组「只覆盖中日韩字形」的面：unicode-range 让它只接管
       中文，size-adjust 只缩放中文，KaTeX 的公式字形完全不受影响。 */
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    :root {
      --mi-cjk-font: "MI CJK", "Microsoft YaHei UI", "Microsoft YaHei",
                     "PingFang SC", system-ui, sans-serif;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--mi-bg-panel, #ffffff);
      color: var(--mi-text-primary, #1f2937);
    }
    #formula-list {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      padding: 0;
    }
    .layer-row {
      position: relative;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 48px;
      padding: 4px 6px 4px 10px;
      background: var(--mi-row-bg, #f9fafb);
      border: 1px solid transparent;
      border-radius: 8px;
      transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }
    .layer-row::before {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      width: 4px;
      content: "";
      background: var(--layer-color, #8ab4f8);
      border-radius: 2px;
    }
    .layer-row:hover {
      border-color: var(--mi-border, #cfd8e1);
    }
    .layer-row.draft .visibility-button,
    .layer-row.draft .settings-button {
      visibility: hidden;
      pointer-events: none;
    }
    .layer-row.selected {
      background: var(--mi-selected-bg, #eaf2fd);
      border-color: var(--mi-selected-border, #8ab4f8);
      box-shadow: 0 0 0 1px var(--mi-selected-border, #8ab4f8) inset;
    }
    .layer-row button {
      flex: 0 0 auto;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--mi-text-primary, #1f2937);
      cursor: pointer;
    }
    .visibility-button {
      width: 28px;
      height: 28px;
      font-size: 14px;
    }
    .visibility-button svg,
    .settings-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .settings-button {
      width: 28px;
      height: 28px;
      font-size: 16px;
      line-height: 1;
    }
    .layer-row button:hover {
      background: var(--mi-btn-hover, #eef2f5);
      border-color: var(--mi-border, #cfd8e1);
    }
    .formula-cell {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 32px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      cursor: text;
    }
    .formula-cell::-webkit-scrollbar { display: none; }
    .matrix-transform-editor {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: var(--mi-row-bg, #f9fafb);
      border: 1px solid var(--mi-border, #cfd8e1);
      border-radius: 8px;
    }
    .matrix-transform-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .matrix-transform-title {
      color: var(--mi-text-primary, #1f2937);
      font-size: 14px;
      font-weight: 600;
    }
    .matrix-transform-hint {
      color: var(--mi-text-primary, #667085);
      font-size: 12px;
    }
    .matrix-transform-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .matrix-transform-bracket {
      color: var(--mi-text-primary, #667085);
      font-size: 24px;
      line-height: 1;
    }
    .matrix-transform-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(48px, 1fr));
      gap: 4px;
      flex: 0 1 140px;
    }
    .matrix-transform-grid math-field {
      box-sizing: border-box;
      min-width: 48px;
      min-height: 30px;
      padding: 1px 4px;
      border: 1px solid var(--mi-border, #cfd8e1);
      border-radius: 5px;
      background: var(--mi-bg-panel, #ffffff);
      font-size: 16px;
      text-align: center;
    }
    .matrix-transform-grid math-field:focus-within {
      border-color: var(--mi-focus, #2f7ebd);
    }
    .matrix-transform-apply {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 4px 10px;
      color: var(--mi-bg-panel, #ffffff);
      background: var(--mi-focus, #2f7ebd);
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .matrix-transform-apply:hover {
      filter: brightness(0.95);
    }
    .matrix-transform-visibility {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mi-text-primary, #667085);
      font-size: 12px;
    }
    .matrix-transform-visibility label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .matrix-transform-visibility input {
      accent-color: var(--mi-focus, #2f7ebd);
    }
    math-field {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 32px;
      padding: 1px 4px;
      overflow: visible;
      min-width: max-content;
      color: var(--mi-text-primary, #1f2937);
      background: transparent;
      border: 0;
      font-size: 18px;
      font-family: var(--mi-cjk-font);
      --text-font-family: var(--mi-cjk-font);
      white-space: nowrap;
      cursor: text;
    }
    math-field.editing {
      padding: 1px 4px;
      background: var(--mi-editing-bg, #fffdf4);
      border: 2px solid var(--mi-editing-border, #e59b00);
      border-radius: 5px;
    }
    .layer-row button:focus-visible, math-field:focus-visible {
      outline: 2px solid var(--mi-focus, #2f7ebd);
      outline-offset: 1px;
    }
    math-field::part(virtual-keyboard-toggle),
    math-field::part(menu-toggle) {
      display: none;
    }
    math-field {
      --selection-background-color: var(--mi-selected-bg, #eaf2fd);
      --contains-highlight-background-color: var(--mi-selected-bg, #eaf2fd);
      --caret-color: var(--mi-focus, #2f7ebd);
    }
    .mathlive-native-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }
    .mathlive-native-action {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      padding: 0;
      color: var(--mi-toolbar-accent, #2f7ebd);
      background: var(--mi-toolbar-bg, transparent);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .mathlive-native-action:hover {
      color: var(--mi-toolbar-accent, #2f7ebd);
      background: var(--mi-toolbar-hover, #eeeeee);
    }
    .mathlive-native-actions svg {
      width: 18px;
      height: 18px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script src="mathlive-bridge.js"></script>
  <script defer src="mathlive.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div id="formula-list"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const list = document.getElementById('formula-list');
      new QWebChannel(qt.webChannelTransport, async (channel) => {
        await customElements.whenDefined('math-field');
        const bridge = channel.objects.bridge;
        let layers = new Map();
        let active = null;
        let matrixTransformEnabled = false;
        let matrixTransformValue = ['1', '0', '0', '1'];
        let showOriginalCoordinateSystem = true;
        let showTransformedCoordinateSystem = true;
        const eyeIcon = () =>
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
        const eyeOffIcon = () =>
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.3 18.3 0 0 1-3.2 4.1M6.3 6.3C3.4 8.1 2 12 2 12s3.5 7 10 7a10.3 10.3 0 0 0 3.2-.5"/></svg>';
        const visibilityIcon = (visible) => visible ? eyeIcon() : eyeOffIcon();
        const settingsIcon = () =>
          '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';

        const matrixEditorFor = () => list.querySelector('.matrix-transform-editor');
        const matrixFields = () => Array.from(
          list.querySelectorAll('.matrix-transform-grid math-field'),
        );
        const matrixText = () => {
          const values = matrixFields().map((field) => field.getValue('latex').trim());
          matrixTransformValue = values.map((value, index) => value || matrixTransformValue[index]);
          return `${matrixTransformValue[0]},${matrixTransformValue[1]};${matrixTransformValue[2]},${matrixTransformValue[3]}`;
        };
        const renderMatrixTransformEditor = () => {
          const current = matrixEditorFor();
          if (!matrixTransformEnabled) {
            current?.remove();
            return;
          }
          if (current) return;
          const editor = document.createElement('section');
          editor.className = 'matrix-transform-editor';
          editor.innerHTML = `
            <div class="matrix-transform-header">
              <span class="matrix-transform-title">矩阵变换</span>
              <span class="matrix-transform-hint">在代数编辑区输入 2×2 矩阵</span>
            </div>
            <div class="matrix-transform-controls">
              <span class="matrix-transform-bracket">[</span>
              <div class="matrix-transform-grid">
                <math-field aria-label="矩阵第一行第一列">${matrixTransformValue[0]}</math-field>
                <math-field aria-label="矩阵第一行第二列">${matrixTransformValue[1]}</math-field>
                <math-field aria-label="矩阵第二行第一列">${matrixTransformValue[2]}</math-field>
                <math-field aria-label="矩阵第二行第二列">${matrixTransformValue[3]}</math-field>
              </div>
              <span class="matrix-transform-bracket">]</span>
              <button type="button" class="matrix-transform-apply">应用</button>
            </div>`;
          const visibility = document.createElement('div');
          visibility.className = 'matrix-transform-visibility';
          visibility.innerHTML = `
            <label><input type="checkbox" data-coordinate-system="original" ${showOriginalCoordinateSystem ? 'checked' : ''}>显示原坐标系</label>
            <label><input type="checkbox" data-coordinate-system="transformed" ${showTransformedCoordinateSystem ? 'checked' : ''}>显示变换后坐标系</label>`;
          editor.append(visibility);
          list.prepend(editor);
          const fields = matrixFields();
          fields.forEach((field) => {
            field.addEventListener('input', () => {
              const index = fields.indexOf(field);
              if (index >= 0) matrixTransformValue[index] = field.getValue('latex').trim();
            });
            field.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') {
                event.preventDefault();
                bridge.matrixSubmitted(matrixText());
              }
            });
          });
          editor.querySelector('.matrix-transform-apply').addEventListener('click', () => {
            bridge.matrixSubmitted(matrixText());
          });
          visibility.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
            checkbox.addEventListener('change', () => {
              if (checkbox.dataset.coordinateSystem === 'original') {
                showOriginalCoordinateSystem = checkbox.checked;
              } else {
                showTransformedCoordinateSystem = checkbox.checked;
              }
              bridge.coordinateSystemVisibilityChanged(
                showOriginalCoordinateSystem,
                showTransformedCoordinateSystem,
              );
            });
          });
        };

        const rowFor = (layerId) => list.querySelector(`[data-layer-id="${CSS.escape(layerId)}"]`);
        const fieldFor = (layerId) => rowFor(layerId)?.querySelector('math-field');
        const hideKeyboard = () => {
          if (window.mathVirtualKeyboard) {
            window.mathVirtualKeyboard.hide();
          }
        };
        const showKeyboard = (field, installToolbar) => {
          if (!window.mathVirtualKeyboard) return;
          field.focus();
          window.mathVirtualKeyboard.show();
          requestAnimationFrame(installToolbar);
        };
        const installFieldToolbar = (field) => MathLiveBridge.installKeyboardToolbarActions(
          field,
          {
            toggleKeyboard: () => {
              if (window.mathVirtualKeyboard.visible) {
                hideKeyboard();
              } else {
                showKeyboard(field, installToolbar);
              }
            },
          },
        );
        const syncRowHeight = (row, field) => {
          const height = MathLiveBridge.formulaHeight(field, 32);
          row.style.minHeight = `${Math.max(48, height + 8)}px`;
        };
        const watchField = (row, field) => {
          const content = field.shadowRoot?.querySelector('[part=content]');
          if (content) {
            new ResizeObserver(() => syncRowHeight(row, field)).observe(content);
          }
          syncRowHeight(row, field);
        };
        const setReadOnly = (field, readOnly) => {
          if (readOnly) {
            field.setAttribute('read-only', '');
            field.readOnly = true;
          } else {
            field.removeAttribute('read-only');
            field.readOnly = false;
          }
        };
        const finishEdit = (restore) => {
          if (!active) return;
          const field = active.field;
          if (restore) {
            field.setValue(active.savedLatex, { silenceNotifications: true });
          }
          setReadOnly(field, true);
          field.classList.remove('editing');
          hideKeyboard();
          active = null;
        };
        const commit = () => {
          if (!active || active.submissionPending) return;
          const latex = active.field.getValue('latex');
          if (!latex || latex === active.savedLatex) {
            if (active.commitImmediately) {
              finishEdit(!latex);
            }
            return;
          }
          active.submissionPending = true;
          bridge.formulaSubmitted(active.layerId, latex);
          if (active.commitImmediately) {
            finishEdit(false);
          }
        };
        const cancel = () => {
          if (!active) return;
          const layerId = active.layerId;
          finishEdit(true);
          bridge.editCancelled(layerId);
        };
        const startEdit = (layerId) => {
          const field = fieldFor(layerId);
          const row = rowFor(layerId);
          if (!field || !row) return;
          if (active && active.layerId !== layerId) {
            cancel();
          }
          active = {
            layerId,
            field,
            savedLatex: field.getValue('latex'),
            submissionPending: false,
            commitImmediately: Boolean(layers.get(layerId)?.commitImmediately),
          };
          setReadOnly(field, false);
          field.classList.add('editing');
          field.scrollIntoView({ block: 'nearest' });
          const installToolbar = installFieldToolbar(field);
          installToolbar();
          field.focus();
          bridge.editRequested(layerId);
        };
        const bindRow = (layer, row, field) => {
          field.mathVirtualKeyboardPolicy = 'manual';
          field.setValue(layer.latex || '', { silenceNotifications: true });
          setReadOnly(field, true);
          watchField(row, field);
          field.addEventListener('pointerdown', (event) => {
            event.stopPropagation();
            if (!layer.editable) return;
            startEdit(layer.id);
          });
          field.addEventListener('input', () => {
            if (active?.layerId === layer.id) {
              active.submissionPending = false;
            }
            syncRowHeight(row, field);
          });
          field.addEventListener('keydown', (event) => {
            if (active?.layerId !== layer.id) return;
            if (event.key === 'Enter' && !event.shiftKey) {
              event.preventDefault();
              commit();
            } else if (event.key === 'Escape') {
              event.preventDefault();
              cancel();
            }
          });
          row.querySelector('.visibility-button').addEventListener('click', (event) => {
            event.stopPropagation();
            const visible = !Boolean(layers.get(layer.id).visible);
            layers.get(layer.id).visible = visible;
            event.currentTarget.innerHTML = visibilityIcon(visible);
            event.currentTarget.title = visible ? '隐藏函数' : '显示函数';
            bridge.visibilityChanged(layer.id, visible);
          });
          row.querySelector('.settings-button').addEventListener('click', (event) => {
            event.stopPropagation();
            const rect = row.getBoundingClientRect();
            bridge.settingsRequested(layer.id, Math.round(rect.top), Math.round(rect.height));
          });
        };
        const setLayers = (nextLayers) => {
          if (active) {
            finishEdit(true);
          }
          layers = new Map(nextLayers.map((layer) => [layer.id, {...layer}]));
          list.replaceChildren();
          for (const layer of layers.values()) {
            const row = document.createElement('div');
            row.className = layer.draft ? 'layer-row draft' : 'layer-row';
            row.dataset.layerId = layer.id;
            const visibility = document.createElement('button');
            visibility.className = 'visibility-button';
            visibility.type = 'button';
            visibility.innerHTML = visibilityIcon(layer.visible);
            visibility.title = layer.visible ? '隐藏函数' : '显示函数';
            const cell = document.createElement('div');
            cell.className = 'formula-cell';
            const field = document.createElement('math-field');
            field.setAttribute('aria-label', layer.editable ? '公式' : '几何对象');
            if (layer.placeholder) field.setAttribute('placeholder', layer.placeholder);
            const settings = document.createElement('button');
            settings.className = 'settings-button';
            settings.type = 'button';
            settings.innerHTML = settingsIcon();
            settings.dataset.deleteLabel = '删除';
            row.style.setProperty('--layer-color', layer.color || '#8ab4f8');
            settings.title = '函数显示与采样设置';
            cell.append(field);
            row.append(visibility, cell, settings);
            list.append(row);
            bindRow(layer, row, field);
          }
          renderMatrixTransformEditor();
        };

        const setMatrixTransform = (enabled) => {
          matrixTransformEnabled = Boolean(enabled);
          renderMatrixTransformEditor();
        };
        const setMatrixTransformVisibility = (showOriginal, showTransformed) => {
          showOriginalCoordinateSystem = Boolean(showOriginal);
          showTransformedCoordinateSystem = Boolean(showTransformed);
          const editor = matrixEditorFor();
          if (!editor) return;
          const original = editor.querySelector('[data-coordinate-system="original"]');
          const transformed = editor.querySelector('[data-coordinate-system="transformed"]');
          if (original) original.checked = showOriginalCoordinateSystem;
          if (transformed) transformed.checked = showTransformedCoordinateSystem;
        };
        const updateLayer = (layer) => {
          layers.set(layer.id, {...layer});
          const field = fieldFor(layer.id);
          const row = rowFor(layer.id);
          if (!field || !row) return;
          row.style.setProperty('--layer-color', layer.color || '#8ab4f8');
          if (!active || active.layerId !== layer.id) {
            field.setValue(layer.latex || '', { silenceNotifications: true });
            setReadOnly(field, true);
          }
          row.querySelector('.visibility-button').innerHTML = visibilityIcon(layer.visible);
          row.querySelector('.visibility-button').title = layer.visible ? '隐藏函数' : '显示函数';
          syncRowHeight(row, field);
        };
        document.addEventListener('pointerdown', (event) => {
          if (!active) return;
          if (event.target.closest('math-field, .MLK__plate, .MLK__backdrop')) return;
          if (active.field.getValue('latex') !== active.savedLatex) {
            commit();
          } else {
            cancel();
          }
        });

        const setSelected = (layerId) => {
          for (const row of list.querySelectorAll('.layer-row')) {
            row.classList.toggle('selected', row.dataset.layerId === layerId);
          }
          const row = layerId != null ? rowFor(layerId) : null;
          if (row) row.scrollIntoView({ block: 'nearest' });
        };
        const beginEdit = (layerId) => {
          const layer = layers.get(layerId);
          if (!layer || !layer.editable) return;
          setSelected(layerId);
          startEdit(layerId);
        };

        window.formulaList = {
          setLayers,
          updateLayer,
          setSelected,
          beginEdit,
          setMatrixTransform,
          setMatrixTransformVisibility,
          acceptEdit: () => finishEdit(false),
          cancelEdit: () => finishEdit(true),
          commitActiveMark: () => {
            if (active?.commitImmediately) commit();
          },
        };
        window.formulaListReady = true;
        if (window.pendingFormulaLayers) {
          setLayers(window.pendingFormulaLayers);
        }
      });
    });
  </script>
</body>
</html>
