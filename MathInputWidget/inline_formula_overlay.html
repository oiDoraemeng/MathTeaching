<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mathlive-fonts.css">
  <style>
    /* 中文走系统黑体：优先装机的现代黑体，找不到再回退到雅黑，最后才用系统默认。
       size-adjust 只缩放这一个族，KaTeX 公式字形不受影响——否则同一字号下
       中文会占满 em 方框，看起来比公式字形大很多。 */
    @font-face {
      font-family: "MI CJK";
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    /* 关键修复：MathLive 把中日韩字符当成普通数学符号渲染（class=ML__cmr / ML__mathit），
       字体链在它自己的样式里写死为 KaTeX_Main / KaTeX_Math，--text-font-family 根本管不到。
       于是中文直接回退到系统默认字体，并占满整个 em 方框，看着比公式字形大一圈。
       下面给这两个数学字体族各补一组「只覆盖中日韩字形」的面：unicode-range 让它只接管
       中文，size-adjust 只缩放中文，KaTeX 的公式字形完全不受影响。 */
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    :root {
      --mi-cjk-font: "MI CJK", "Microsoft YaHei UI", "Microsoft YaHei",
                     "PingFang SC", system-ui, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--mi-bg-panel, transparent);
    }
    math-field {
      box-sizing: border-box;
      position: absolute;
      margin: 0;
      min-height: 38px;
      padding: 1px 4px;
      overflow: visible;
      color: var(--mi-text-primary, #1f2937);
      background: var(--mi-editing-bg, #f9fafb);
      border: 1px solid var(--mi-focus, #2f7ebd);
      --caret-color: var(--mi-focus, #2f7ebd);
      --selection-background-color: var(--mi-selected-bg, #eaf2fd);
      --contains-highlight-background-color: var(--mi-selected-bg, #eaf2fd);
      border-radius: 4px;
      font-size: 18px;
      /* 文本 run 走 --text-font-family（MathLive 的公开变量）；font-family 兜住
         数学模式里 KaTeX 字体没有的中日韩字形。两处都要设，中文才会统一变好看。 */
      font-family: var(--mi-cjk-font);
      --text-font-family: var(--mi-cjk-font);
      cursor: text;
    }
    math-field::part(virtual-keyboard-toggle),
    math-field::part(menu-toggle) {
      display: none;
    }
    .mathlive-native-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }
    .mathlive-native-action {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      padding: 0;
      color: var(--mi-toolbar-accent, #2c2e2f);
      background: var(--mi-toolbar-bg, transparent);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .mathlive-native-action:hover {
      color: var(--mi-toolbar-accent, #2f7ebd);
      background: var(--mi-toolbar-hover, #eeeeee);
    }
    .mathlive-native-actions svg {
      width: 18px;
      height: 18px;
    }
  </style>
  <script src="mathlive-bridge.js"></script>
  <script defer src="mathlive.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <math-field id="formula" aria-label="Edit formula"></math-field>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const formula = document.getElementById('formula');
      new QWebChannel(qt.webChannelTransport, async (channel) => {
        await customElements.whenDefined('math-field');
        const bridge = channel.objects.bridge;
        let savedLatex = '';
        let submissionPending = false;

        const setRect = (rect) => {
          formula.style.left = `${rect.left}px`;
          formula.style.top = `${rect.top}px`;
          formula.style.width = `${rect.width}px`;
          formula.style.height = `${rect.height}px`;
        };
        const height = MathLiveBridge.createHeightReporter(formula, bridge, 38);
        const hideKeyboard = () => {
          if (window.mathVirtualKeyboard) {
            window.mathVirtualKeyboard.hide();
          }
        };
        const showKeyboard = () => {
          if (window.mathVirtualKeyboard) {
            window.mathVirtualKeyboard.show();
            requestAnimationFrame(installToolbar);
          }
        };
        const installToolbar = MathLiveBridge.installKeyboardToolbarActions(formula, {
          toggleKeyboard: () => {
            if (window.mathVirtualKeyboard.visible) {
              hideKeyboard();
            } else {
              formula.focus();
              showKeyboard();
            }
          },
        });
        const commit = () => {
          const latex = formula.getValue('latex');
          if (!latex || latex === savedLatex || submissionPending) {
            return;
          }
          submissionPending = true;
          bridge.formulaSubmitted(latex);
        };
        const open = (config) => {
          savedLatex = config.latex || '';
          submissionPending = false;
          setRect(config);
          formula.setValue(savedLatex, { silenceNotifications: true });
          height.schedule();
          formula.focus();
          showKeyboard();
        };

        formula.mathVirtualKeyboardPolicy = 'manual';
        installToolbar();
        formula.addEventListener('input', () => {
          submissionPending = false;
          height.schedule();
        });
        height.observeContent();
        formula.addEventListener('pointerdown', () => {
          formula.focus();
          if (window.mathVirtualKeyboard) {
            window.mathVirtualKeyboard.show();
          }
        });
        formula.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            commit();
          } else if (event.key === 'Escape') {
            event.preventDefault();
            hideKeyboard();
            bridge.dismissed();
          }
        });
        document.addEventListener('pointerdown', (event) => {
          if (event.target.closest('math-field, .MLK__plate, .MLK__backdrop')) {
            return;
          }
          if (formula.getValue('latex') !== savedLatex) {
            commit();
            return;
          }
          bridge.dismissed();
        });

        window.inlineFormulaEditor = { open, setRect, hideKeyboard };
        window.inlineFormulaEditorReady = true;
        if (window.pendingInlineFormula) {
          open(window.pendingInlineFormula);
        }
      });
    });
  </script>
</body>
</html>
