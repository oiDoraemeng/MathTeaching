<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mathlive-fonts.css">
  <style>
    /* 中文走系统黑体：优先装机的现代黑体，找不到再回退到雅黑，最后才用系统默认。
       size-adjust 只缩放这一个族，KaTeX 公式字形不受影响——否则同一字号下
       中文会占满 em 方框，看起来比公式字形大很多。 */
    @font-face {
      font-family: "MI CJK";
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    /* 关键修复：MathLive 把中日韩字符当成普通数学符号渲染（class=ML__cmr / ML__mathit），
       字体链在它自己的样式里写死为 KaTeX_Main / KaTeX_Math，--text-font-family 根本管不到。
       于是中文直接回退到系统默认字体，并占满整个 em 方框，看着比公式字形大一圈。
       下面给这两个数学字体族各补一组「只覆盖中日韩字形」的面：unicode-range 让它只接管
       中文，size-adjust 只缩放中文，KaTeX 的公式字形完全不受影响。 */
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Main;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: normal;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 400;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    @font-face {
      font-family: KaTeX_Math;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("微软雅黑"),
           local("HarmonyOS Sans SC"), local("MiSans"), local("Source Han Sans SC"),
           local("Source Han Sans CN"), local("Noto Sans SC"), local("思源黑体"),
           local("PingFang SC"), local("Heiti SC");
      font-style: italic;
      font-weight: 700;
      unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
      size-adjust: 80%;
    }
    :root {
      --mi-cjk-font: "MI CJK", "Microsoft YaHei UI", "Microsoft YaHei",
                     "PingFang SC", system-ui, sans-serif;
    }
    html, body { margin: 0; min-height: 100%; background: var(--mi-bg-panel, #ffffff); color: var(--mi-text-primary, #1f2937); overflow: hidden; }
    math-field {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      height: auto;
      overflow: visible;
      color: var(--mi-text-primary, #17212e);
      background: var(--mi-bg-panel, #ffffff);
      border: 1px solid var(--mi-border, #cbd3dd);
      border-radius: 4px;
      font-size: 20px;
      /* 文本 run 走 --text-font-family（MathLive 的公开变量）；font-family 兜住
         数学模式里 KaTeX 字体没有的中日韩字形。两处都要设，中文才会统一变好看。 */
      font-family: var(--mi-cjk-font);
      --text-font-family: var(--mi-cjk-font);
      --caret-color: var(--mi-focus, #1474b8);
      --selection-background-color: var(--mi-selected-bg, #d8ecfa);
      --contains-highlight-background-color: var(--mi-selected-bg, #eaf5fd);
    }
    math-field:focus-within { border: 2px solid var(--mi-focus, #2f7ebd); padding: 7px 9px; }
    math-field::part(virtual-keyboard-toggle),
    math-field::part(menu-toggle) {
      display: none;
    }
    .mathlive-native-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }
    .mathlive-native-action {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      color: var(--mi-toolbar-accent, #2c2e2f);
      background: var(--mi-toolbar-bg, transparent);
      border-radius: 4px;
      cursor: pointer;
    }
    .mathlive-native-action:hover {
      color: var(--mi-toolbar-accent, #2f7ebd);
      background: var(--mi-toolbar-hover, #eeeeee);
    }
    .mathlive-native-actions svg {
      width: 18px;
      height: 18px;
    }
  </style>
  <script src="mathlive-bridge.js"></script>
  <script defer src="mathlive.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <math-field id="formula" aria-label="数学公式输入" virtual-keyboard-mode="onfocus"></math-field>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const field = document.getElementById('formula');
      new QWebChannel(qt.webChannelTransport, async (channel) => {
      await customElements.whenDefined('math-field');
      const bridge = channel.objects.bridge;
      field.mathVirtualKeyboardPolicy = 'manual';

      const height = MathLiveBridge.createHeightReporter(field, bridge, 42);
      const installToolbar = MathLiveBridge.installKeyboardToolbarActions(field, {
        toggleKeyboard: () => {
          if (window.mathVirtualKeyboard.visible) {
            window.mathVirtualKeyboard.hide();
          } else {
            field.focus();
            window.mathVirtualKeyboard.show();
          }
        },
      });

      field.addEventListener('input', () => {
        bridge.latexChanged(field.getValue('latex'));
        height.schedule();
      });
      field.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          bridge.submitted(field.getValue('latex'));
        }
      });
      const reportKeyboardHeight = () => {
        bridge.virtualKeyboardHeightChanged(Math.ceil(window.mathVirtualKeyboard.boundingRect.height || 0));
      };
      window.mathVirtualKeyboard.addEventListener('geometrychange', reportKeyboardHeight);
      field.addEventListener('focusin', () => {
        requestAnimationFrame(installToolbar);
        requestAnimationFrame(reportKeyboardHeight);
      });
        window.mathInput = {
        getLatex: () => field.getValue('latex'),
        setLatex: (latex) => {
          field.setValue(latex || '', { silenceNotifications: true });
          height.schedule();
        },
        setPlaceholder: (placeholder) => { field.placeholder = placeholder || ''; },
        focus: (showKeyboard = false) => {
          field.focus();
          if (showKeyboard) window.mathVirtualKeyboard.show();
          requestAnimationFrame(installToolbar);
          requestAnimationFrame(reportKeyboardHeight);
        },
        hideKeyboard: () => { window.mathVirtualKeyboard.hide(); requestAnimationFrame(reportKeyboardHeight); },
        };
        height.observeContent();
        installToolbar();
        window.mathInputReady = true;
        window.mathInput.setLatex(window.pendingMathLatex || '');
      });
    });
  </script>
</body>
</html>
