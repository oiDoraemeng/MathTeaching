<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mathlive-fonts.css">
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; background: #ffffff; overflow: hidden; }
    math-field {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      color: #17212e;
      background: #ffffff;
      border: 1px solid #cbd3dd;
      border-radius: 4px;
      font-size: 20px;
      --caret-color: #1474b8;
      --selection-background-color: #d8ecfa;
      --contains-highlight-background-color: #eaf5fd;
    }
    math-field:focus-within { border: 2px solid #2f7ebd; padding: 7px 9px; }
  </style>
  <script defer src="mathlive.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <math-field id="formula" aria-label="数学公式输入" virtual-keyboard-mode="onfocus"></math-field>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const field = document.getElementById('formula');
      new QWebChannel(qt.webChannelTransport, async (channel) => {
      await customElements.whenDefined('math-field');
      const bridge = channel.objects.bridge;
      field.mathVirtualKeyboardPolicy = 'manual';
      field.virtualKeyboardToolbar = 'none';
      field.addEventListener('input', () => bridge.latexChanged(field.getValue('latex')));
      field.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          bridge.submitted(field.getValue('latex'));
        }
      });
      const reportKeyboardHeight = () => {
        bridge.virtualKeyboardHeightChanged(Math.ceil(window.mathVirtualKeyboard.boundingRect.height || 0));
      };
      window.mathVirtualKeyboard.addEventListener('geometrychange', reportKeyboardHeight);
      field.addEventListener('focusin', () => {
        window.mathVirtualKeyboard.show();
        requestAnimationFrame(reportKeyboardHeight);
      });
        window.mathInput = {
        getLatex: () => field.getValue('latex'),
        setLatex: (latex) => field.setValue(latex || '', { silenceNotifications: true }),
        setPlaceholder: (placeholder) => { field.placeholder = placeholder || ''; },
        focus: () => { field.focus(); window.mathVirtualKeyboard.show(); requestAnimationFrame(reportKeyboardHeight); },
        hideKeyboard: () => { window.mathVirtualKeyboard.hide(); requestAnimationFrame(reportKeyboardHeight); },
        };
        window.mathInputReady = true;
        window.mathInput.setLatex(window.pendingMathLatex || '');
      });
    });
  </script>
</body>
</html>
