[project]
name = "math3d-teaching"
version = "0.1.0"
description = "Interactive 3D analytic geometry teaching application"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyvista>=0.45",
    "pyvistaqt>=0.11",
    "pyside6>=6.8,<6.9",
    "scipy>=1.14",
    "sympy>=1.13",
    "antlr4-python3-runtime==4.11",
]

[tool.uv]
package = false
